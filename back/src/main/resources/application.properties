spring.application.name=catchup
server.address=127.0.0.1
spring.datasource.url=jdbc:postgresql://localhost:5432/catchup
spring.datasource.username=${CATCHUP_DB_USER}
spring.datasource.password=${CATCHUP_DB_PASSWORD:}
spring.sql.init.mode=always
catchup.attachments.bucket=${CATCHUP_S3_BUCKET:}
catchup.attachments.region=${CATCHUP_S3_REGION:ap-southeast-2}
catchup.attachments.prefix=${CATCHUP_S3_PREFIX:attachments/}
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=104MB
server.tomcat.max-part-count=-1
